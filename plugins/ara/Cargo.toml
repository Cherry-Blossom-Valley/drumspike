# Drum Spike ARA plugin (M1a, #525): the plugin analyses the host's tracks with the Drum
# Spike service (ARA, no editor). Own folder outside the workspace members: the root
# `cargo metadata --no-deps` must not name it, and the workspace must build without the
# ARA SDK (the bindgen in build.rs reads $ARA_API_DIR, fetched by check.sh).
[package]
name = "drumspike-ara"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "drumspike_ara"
crate-type = ["cdylib", "rlib"]

[dependencies]
clap-sys = "0.5"
# the app service and the project document layer, used as normal crates (the same path
# the workspace members take)
drumspike-app = { path = "../../crates/app" }
drumspike-core = { path = "../../crates/core" }
serde = { version = "=1.0.229", features = ["derive"] }
# float_roundtrip + preserve_order: the event lists go out byte for byte as the service
# wrote them (the same features the app pins)
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
indexmap = { version = "2", features = ["serde"] }

# the test host of check.sh (src/bin/ara-host.rs): loads the CLAP bundle with dlopen
libloading = "0.8"

# M1b2: the editor window. A `wry` web view (WKWebView) as a child of the host's NSView, the
# version of spike S2 (no default features: the Linux backends must not enter the build).
# objc2 and the app kit and foundation bindings are what wry brings; the plugin needs them
# to make the web view the first responder, to read the size of the host's view, and the
# test host of check.sh to open a real window. The licences are in README.md.
wry = { version = "=0.57.0", default-features = false }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# The rule for the fault and test switches (switches.json): a build with this feature reads them
# from the environment (the gate builds so); a delivery build, without it, never does. The report
# variables DS_ARA_OUT and DS_ARA_CACHE do not depend on it.
[features]
default = []
test-switches = []

[[bin]]
name = "ara-host"
path = "src/bin/ara-host.rs"

[build-dependencies]
bindgen = "0.72"

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"

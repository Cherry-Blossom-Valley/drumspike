# Workspace root for the Rust migration (docs/migration/plan.md, phase 1).
# Members: crates/core (drumspike-core, the application logic), crates/app (drumspike-app, the
# service layer and commands, P3-3a), crates/devtools (drumspike-devtools: the parity, bench, cache_tool,
# service_tool and ds-bridge binaries, LAYOUT 2),
# apps/desktop/src-tauri (drumspike-desktop, the Tauri shell, P3-1b).
[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/devtools", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.9.8"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "allow" # 4992: 1282/3582/127/1 (warn once burned down; clippy.toml exempts tests)

# R8 (#168) baseline: every lint below fires today and is allowed with its count (core/app/devtools/desktop,
# lib + bins + tests, all targets). The burn-down removes one allow at a time; a lint at 0 is deleted here.
cast_possible_truncation = "allow" # 804: 594/171/33/6
cast_precision_loss = "allow" # 609: 447/144/17/1
must_use_candidate = "allow" # 530: 289/199/0/42
cast_lossless = "allow" # 493: 400/88/5/0
many_single_char_names = "allow" # 447: 363/58/26/0
cast_sign_loss = "allow" # 444: 356/78/10/0
cast_possible_wrap = "allow" # 226: 200/20/6/0
doc_markdown = "allow" # 128: 75/22/8/23
needless_pass_by_value = "allow" # 124: 4/19/1/100
assert_is_empty = "allow" # 109: 59/38/0/12
unreadable_literal = "allow" # 75: 55/17/0/3
float_cmp = "allow" # 41: 27/14/0/0
too_many_lines = "allow" # 41: 15/19/4/3
manual_midpoint = "allow" # 31: 28/3/0/0
map_unwrap_or = "allow" # 31: 17/12/1/1
similar_names = "allow" # 21: 15/4/2/0
match_same_arms = "allow" # 20: 14/6/0/0
cloned_instead_of_copied = "allow" # 14: 8/3/3/0
single_match_else = "allow" # 14: 0/13/1/0
manual_let_else = "allow" # 11: 5/6/0/0
maybe_infinite_iter = "allow" # 11: 10/1/0/0
format_collect = "allow" # 10: 4/5/1/0
items_after_statements = "allow" # 9: 3/4/0/2
needless_for_each = "allow" # 9: 7/0/2/0
assigning_clones = "allow" # 8: 0/8/0/0
unused_self = "allow" # 7: 1/5/1/0
unnecessary_wraps = "allow" # 6: 0/6/0/0
default_trait_access = "allow" # 5: 1/4/0/0
format_push_string = "allow" # 5: 0/5/0/0
if_not_else = "allow" # 4: 3/0/0/1
implicit_clone = "allow" # 4: 3/1/0/0
match_wildcard_for_single_variants = "allow" # 4: 2/2/0/0
nonminimal_bool = "allow" # 4: 0/3/0/1
case_sensitive_file_extension_comparisons = "allow" # 3: 1/1/0/1
elidable_lifetime_names = "allow" # 3: 0/3/0/0
manual_assert_eq = "allow" # 3: 0/1/1/1
return_self_not_must_use = "allow" # 3: 3/0/0/0
stable_sort_primitive = "allow" # 3: 3/0/0/0
bool_to_int_with_if = "allow" # 2: 0/1/0/1
ignored_unit_patterns = "allow" # 2: 0/2/0/0
index_refutable_slice = "allow" # 2: 2/0/0/0
ptr_as_ptr = "allow" # 2: 0/2/0/0
range_plus_one = "allow" # 2: 2/0/0/0
struct_field_names = "allow" # 2: 0/2/0/0
trivially_copy_pass_by_ref = "allow" # 2: 2/0/0/0
unnested_or_patterns = "allow" # 2: 1/1/0/0
used_underscore_binding = "allow" # 2: 0/1/1/0
borrow_as_ptr = "allow" # 1: 1/0/0/0
comparison_chain = "allow" # 1: 1/0/0/0
inconsistent_struct_constructor = "allow" # 1: 0/1/0/0
large_stack_arrays = "allow" # 1: 1/0/0/0
option_option = "allow" # 1: 1/0/0/0
ref_option = "allow" # 1: 0/1/0/0
single_char_pattern = "allow" # 1: 1/0/0/0
struct_excessive_bools = "allow" # 1: 0/1/0/0
unchecked_time_subtraction = "allow" # 1: 0/1/0/0
unnecessary_box_returns = "allow" # 1: 1/0/0/0
unnecessary_debug_formatting = "allow" # 1: 0/1/0/0
unnecessary_semicolon = "allow" # 1: 0/0/0/1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Keep the release settings for benches and the parity binary.
[profile.bench]
inherits = "release"

# P3-5a: the playback resampler is too slow unoptimized (a full core in debug builds);
# optimize these crates also in dev builds, the debug .app (G3) included.
[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

# P3-5b: at opt-level 0 the debug .app played only after 5 to 6 s and sought in 3 s (30 tracks);
# the core crate runs the transport reader and mixer, so it is optimized in dev builds too.
[profile.dev.package.drumspike-core]
opt-level = 3

# P3-4d: the relink search hashes the first MiB of 30 files; unoptimised SHA-1 took 2 s on x86.
[profile.dev.package.sha1]
opt-level = 3

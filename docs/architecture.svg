<g><rect class="core" x="40" y="500" width="600" height="130" rx="20"/><text class="th" x="340" y="520" text-anchor="middle" dominant-baseline="central">drumspike-core: functional core</text><text class="ts" x="340" y="538" text-anchor="middle" dominant-baseline="central">Pure: samples and RuleSet in, data out</text></g>
<g><rect class="box" x="60" y="556" width="125" height="56" rx="8"/><text class="th" x="122" y="575" text-anchor="middle" dominant-baseline="central">detect</text><text class="ts" x="122" y="594" text-anchor="middle" dominant-baseline="central">Onsets, bleed</text></g>
<g><rect class="box" x="205" y="556" width="125" height="56" rx="8"/><text class="th" x="267" y="575" text-anchor="middle" dominant-baseline="central">refine</text><text class="ts" x="267" y="594" text-anchor="middle" dominant-baseline="central">Attack start, v7</text></g>
<g><rect class="box" x="350" y="556" width="125" height="56" rx="8"/><text class="th" x="412" y="575" text-anchor="middle" dominant-baseline="central">project</text><text class="ts" x="412" y="594" text-anchor="middle" dominant-baseline="central">Document, MIDI</text></g>
<g><rect class="box" x="495" y="556" width="125" height="56" rx="8"/><text class="th" x="557" y="575" text-anchor="middle" dominant-baseline="central">tempo</text><text class="ts" x="557" y="594" text-anchor="middle" dominant-baseline="central">Map, velocity</text></g>
<text class="ts" x="340" y="656" text-anchor="middle" dominant-baseline="central">Dependencies point inward only: page, adapters, app, core</text>

<g><rect class="box" x="60" y="386" width="125" height="56" rx="8"/><text class="th" x="122" y="405" text-anchor="middle" dominant-baseline="central">Registry</text><text class="ts" x="122" y="424" text-anchor="middle" dominant-baseline="central">One command map</text></g>
<g><rect class="box" x="205" y="386" width="125" height="56" rx="8"/><text class="th" x="267" y="405" text-anchor="middle" dominant-baseline="central">Session steps</text><text class="ts" x="267" y="424" text-anchor="middle" dominant-baseline="central">Pipes, filters</text></g>

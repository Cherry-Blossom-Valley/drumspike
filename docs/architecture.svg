<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" role="img">
<title>Drum Spike architecture</title>
<desc>Layers from the outside in: the editor page, backend.js, four adapters (Tauri shell, ds-bridge, CLI, MCP), the app service with its registry, session steps, policy marks and config, and the pure core with detect, refine, project and tempo. Dependencies point inward.</desc>
<style>
  .bg { fill: #ffffff; }
  .node { fill: #f6f5f3; stroke: #8a8782; stroke-width: 1; }
  .app { fill: #f1ecf8; stroke: #7a5aa6; stroke-width: 1; }
  .core { fill: #e9f4f2; stroke: #3a8a7c; stroke-width: 1; }
  .box { fill: #ffffff; stroke: #8a8782; stroke-width: 1; }
  .th { font: 600 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f1e1c; }
  .ts { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5a5752; }
  .arr { stroke: #5a5752; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5a5752" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="680"/>
<g><rect class="node" x="40" y="40" width="600" height="56" rx="8"/><text class="th" x="340" y="59" text-anchor="middle" dominant-baseline="central">Editor page (static/)</text><text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">Feature scripts wired by Init(deps) hooks</text></g>
<line x1="340" y1="96" x2="340" y2="132" class="arr" marker-end="url(#arrow)"/>
<g><rect class="node" x="210" y="136" width="260" height="44" rx="8"/><text class="th" x="340" y="158" text-anchor="middle" dominant-baseline="central">backend.js: the only door</text></g>
<line x1="250" y1="180" x2="130" y2="218" class="arr" marker-end="url(#arrow)"/>
<line x1="330" y1="180" x2="270" y2="218" class="arr" marker-end="url(#arrow)"/>
<g><rect class="node" x="50" y="220" width="130" height="56" rx="8"/><text class="th" x="115" y="239" text-anchor="middle" dominant-baseline="central">Tauri shell</text><text class="ts" x="115" y="258" text-anchor="middle" dominant-baseline="central">Window, menu</text></g>
<g><rect class="node" x="200" y="220" width="130" height="56" rx="8"/><text class="th" x="265" y="239" text-anchor="middle" dominant-baseline="central">ds-bridge</text><text class="ts" x="265" y="258" text-anchor="middle" dominant-baseline="central">Test bridge</text></g>
<g><rect class="node" x="350" y="220" width="130" height="56" rx="8"/><text class="th" x="415" y="239" text-anchor="middle" dominant-baseline="central">CLI</text><text class="ts" x="415" y="258" text-anchor="middle" dominant-baseline="central">Command line</text></g>
<g><rect class="node" x="500" y="220" width="130" height="56" rx="8"/><text class="th" x="565" y="239" text-anchor="middle" dominant-baseline="central">MCP</text><text class="ts" x="565" y="258" text-anchor="middle" dominant-baseline="central">Agent tools</text></g>
<line x1="115" y1="276" x2="115" y2="328" class="arr" marker-end="url(#arrow)"/>
<line x1="265" y1="276" x2="265" y2="328" class="arr" marker-end="url(#arrow)"/>
<line x1="415" y1="276" x2="415" y2="328" class="arr" marker-end="url(#arrow)"/>
<line x1="565" y1="276" x2="565" y2="328" class="arr" marker-end="url(#arrow)"/>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drum Spike</title>
<link rel="stylesheet" href="/splash.css?v=1">
</head>
<body>
<main class="card" aria-label="Drum Spike is starting">
  <div class="stage">
    <img class="art" src="/brand/drumspike-icon.svg" alt="Drum Spike icon: an orange spike on the first sample of a blue drum waveform" width="300" height="300">
    <div class="text">
      <h1 class="name">Drum Spike</h1>
      <p id="version" class="version">Version</p>
      <p id="status" class="status" role="status" aria-live="polite">Starting Drum Spike&hellip;</p>
      <div class="bar" aria-hidden="true"><span></span></div>
    </div>
  </div>
  <footer class="by">
    <span>brought to you by</span>
    <img class="cbv" src="/brand/cbv-logo-white.png" alt="Cherry Blossom Valley" height="40">
  </footer>
</main>
<script src="/splash.js?v=1"></script>
</body>
</html>
